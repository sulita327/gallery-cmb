<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Color Me Bad</title>

<link rel="stylesheet" href="./style.css">

</head>


<body>

<header class="site-header">

    <a href="index.html" class="logo-link">
        <img
            src="logo.png"
            alt="Color Me Bad"
            class="logo"
        >
    </a>


    <nav class="main-nav">

        <a href="exhibitions.html">
            Exhibitions
        </a>

        <a href="about.html">
            About
        </a>

    </nav>

</header>


<main class="home">

    <section class="poster-carousel">

        <button
            class="poster-button poster-prev"
            onclick="changePoster(-1)"
            aria-label="Previous poster"
        >
            ‹
        </button>


        <div class="poster-stage">

            <img
                class="poster-slide active"
                src="./poster-01.jpg"
                alt="Exhibition poster"
            >

            <img
                class="poster-slide"
                src="./poster-02.jpg"
                alt="Exhibition poster"
            >

            <img
                class="poster-slide"
                src="./poster-03.jpg"
                alt="Exhibition poster"
            >

            <img
                class="poster-slide"
                src="./poster-04.jpg"
                alt="Exhibition poster"
            >

        </div>


        <button
            class="poster-button poster-next"
            onclick="changePoster(1)"
            aria-label="Next poster"
        >
            ›
        </button>

    </section>

</main>


<script>

let posterIndex = 0;

const posters =
    document.querySelectorAll(".poster-slide");


function changePoster(direction) {

    const nextIndex =
        (posterIndex + direction + posters.length)
        % posters.length;

    posters[posterIndex]
        .classList
        .remove("active");

    posters[nextIndex]
        .classList
        .add("active");

    posterIndex = nextIndex;

}

</script>


</body>

</html>
