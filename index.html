<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Color Me Bad</title>

<link rel="stylesheet" href="./style.css">

</head>


<body>

<header class="site-header">

    <a href="index.html" class="logo-link">
        <img
            src="logo.png"
            alt="Color Me Bad"
            class="logo"
        >
    </a>


    <nav class="main-nav">

        <a href="exhibitions.html">
            Exhibitions
        </a>

        <a href="about.html">
            About
        </a>

    </nav>

</header>


<main class="home">

    <section class="poster-carousel">

        <button
            class="poster-button poster-prev"
            onclick="changePoster(-1)"
            aria-label="Previous poster"
        >
            ‹
        </button>


        <div class="poster-stage">

            <img
                class="poster-slide active"
                src="./onview/purple%20vitality.jpg"
                alt="생명: Purple Vitality"
            >
            
            <img
                class="poster-slide"
                src="./onview/감각의확장.jpg"
                alt="감각의 확장: 오 (5)의 해체"
            >

            <img
                class="poster-slide"
                src="./onview/strange-exhibition.jpg"
                alt="Strange Exhibition"
            >

            
        </div>


        <button
            class="poster-button poster-next"
            onclick="changePoster(1)"
            aria-label="Next poster"
        >
            ›
        </button>

    </section>

</main>

    <footer>

   © 2026 Gallery Color Me Bad. All rights reserved.
    <p>서울시 용산구 소월로20길 67, B1</p>

</footer>

<script>

let posterIndex = 0;

const posters =
    document.querySelectorAll(".poster-slide");


function changePoster(direction) {

    const nextIndex =
        (posterIndex + direction + posters.length)
        % posters.length;

    posters[posterIndex]
        .classList
        .remove("active");

    posters[nextIndex]
        .classList
        .add("active");

    posterIndex = nextIndex;
}
    
setInterval(() => {
  changePoster(1);
}, 5000);
    
</script>


</body>

</html>
